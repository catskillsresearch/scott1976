# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1976 Data Types as Lattices"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1976 paper *Data Types
    as Lattices* (Technical Monograph PRG-5; SIAM J. Comput. 5 (1976),
    522–587). The library target is a 1:1 onto translation of every numbered
    definition, theorem, example, and Tables 1–3. Palomar Challenge/Solution
    will later select a minimum spanning set of numbered theorems; the
    comparator presently names 1.1, 1.2, 1.4, 2.5, 4.2, and 6.1. Lean is
    written by AI agents under the direction and review of the author. Dana
    Scott did not participate in or endorse this formalization. There is no
    sorry outside the deliberate holes in Challenge.lean, no project-defined
    axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.LO, cs.LO]
  msc2020: ["06B35", "68Q55", "03B70"]

status:
  scope: >-
    The library target is a 1:1 onto translation of every numbered item in
    Scott 1976. That translation is not yet complete; remaining gaps are
    listed in known_gaps and arxiv.md. Comparator currently names Theorems
    1.1, 1.2, 1.4, 2.5, 4.2, and 6.1 as a temporary spanning subset.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Scott1976.DataTypesAsLattices.theorem_1_1"
      file: "Scott1976/DataTypesAsLattices/Continuous.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_1_2"
      file: "Scott1976/DataTypesAsLattices/Graph.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_1_4"
      file: "Scott1976/DataTypesAsLattices/FixedPoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_2_5"
      file: "Scott1976/DataTypesAsLattices/Lambda.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_4_2"
      file: "Scott1976/DataTypesAsLattices/Retracts.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_6_1"
      file: "Scott1976/DataTypesAsLattices/Classification.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Working source: sources/Data_Types_as_Lattices_vision.md
    (transcription of sources/Data_Types_as_Lattices.pdf). Compared
    claims are Theorems 1.1, 1.2, 1.4, 2.5, 4.2, and 6.1. The repository is
    a partial formalization; exact divergences are listed in known_gaps and
    in arxiv.md.

sources:
  - title: "Data Types as Lattices"
    authors: ["Dana S. Scott"]
    type: "article"
    location: >-
      Technical Monograph PRG-5, Oxford University Computing Laboratory,
      Programming Research Group, September 1976; reprinted SIAM Journal on
      Computing, Volume 5, 1976, pages 522–587.
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Primary source. Dana Scott was not contacted and did not participate
      in or endorse this formalization. Working PDF:
      sources/Data_Types_as_Lattices.pdf.

