# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1976 Data Types as Lattices"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1976 paper *Data Types
    as Lattices* (Technical Monograph PRG-5; SIAM J. Comput. 5 (1976),
    522–587). The library target is a 1:1 onto translation of every numbered
    definition, theorem, example, and Tables 1–3. Palomar Challenge/Solution
    will later select a minimum spanning set of numbered theorems; the
    comparator presently names 2.6, 3.5, 3.7, 4.6, 6.7, and 7.4. Lean is
    written by AI agents under the direction and review of the author. Dana
    Scott did not participate in or endorse this formalization. There is no
    sorry outside the deliberate holes in Challenge.lean, no project-defined
    axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.LO, cs.LO]
  msc2020: ["06B35", "68Q55", "03B70"]

status:
  scope: >-
    The library target is a 1:1 onto translation of every numbered item in
    Scott 1976. That translation is not yet complete; remaining gaps are
    listed in known_gaps and arxiv.md. Comparator currently names Theorems
    2.6, 3.5, 3.7, 4.6, 6.7, and 7.4 as a spanning subset.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Scott1976.DataTypesAsLattices.theorem_2_6"
      file: "Scott1976/DataTypesAsLattices/Computability.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_3_5"
      file: "Scott1976/DataTypesAsLattices/Enumeration.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_3_7"
      file: "Scott1976/DataTypesAsLattices/Enumeration.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_4_6"
      file: "Scott1976/DataTypesAsLattices/Retracts.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_6_7"
      file: "Scott1976/DataTypesAsLattices/Classification.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1976.DataTypesAsLattices.theorem_7_4"
      file: "Scott1976/DataTypesAsLattices/Functionality.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Working source: sources/Data_Types_as_Lattices_vision.md
    (transcription of sources/Data_Types_as_Lattices.pdf). Compared
    claims are Theorems 2.6, 3.5, 3.7, 4.6, 6.7, and 7.4. Remaining
    source-level divergences are listed in known_gaps and in arxiv.md.

sources:
  - title: "Data Types as Lattices"
    authors: ["Dana S. Scott"]
    type: "article"
    location: >-
      Technical Monograph PRG-5, Oxford University Computing Laboratory,
      Programming Research Group, September 1976; reprinted SIAM Journal on
      Computing, Volume 5, 1976, pages 522–587.
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Primary source. Dana Scott was not contacted and did not participate
      in or endorse this formalization. Working PDF:
      sources/Data_Types_as_Lattices.pdf.

related_formalizations:
  - id: "https://github.com/catskillsresearch/scott1972"
    relationship: other
    note: "Same-author formalization of Scott Continuous Lattices (1972); not imported here."

  - id: "https://github.com/catskillsresearch/scott1980"
    relationship: other
    note: "Same-author formalization of Scott PRG-19 (1980); not imported here."

  - id: "https://github.com/catskillsresearch/scott1982"
    relationship: other
    note: "Same-author formalization of Scott 1982 information systems; not imported here."

  - id: "https://github.com/catskillsresearch/scott_models"
    relationship: other
    note: >-
      Same-author sibling with cross-presentation equivalence theorems.
      This repository is an independent Palomar submission for the 1976 paper
      alone. See PROVENANCE.md.

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build repair,
        vision-OCR transcription, and arxiv.md drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: "Heaviest proof work."
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every definition
        and claim, and takes sole responsibility for the mathematical content.
        Dana Scott was not consulted.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    follows the scott1972 / cardb template.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review of
    the Lean source, and no review or endorsement by Dana Scott. Every proof
    step is checked by the Lean kernel.

known_gaps:
  - >-
    Theorem 2.3 is packaged only for arity ≤ 3. Theorem 2.6 is the unary
    case of Scott's k-ary definability theorem.
  - >-
    (4.45) packages `ℋ⟦τ⟧ : env → lamb` on finite encoded terms and a
    retract `Hcomb : exp → (env → lamb)`; it is not a continuous decoder
    of arbitrary `exp` objects.
  - >-
    Theorem 5.4 has `⊠` as a closure typed on `V`; `⊞` is a retract via
    (4.4), but `I ⊆ ⊞` fails on empty tags because (5.13) is strict.
    Do not read `theorem_5_4_plus` as `IsClosure (boxPlus …)`.
  - >-
    Table 3 effective-closure remarks are not all recorded. Theorem 7.2
    omits uniqueness of sum mediators.

limitations:
  - >-
    Comparator compares Theorems 2.6, 3.5, 3.7, 4.6, 6.7, and 7.4.
  - >-
    Challenge.lean may contain deliberate sorries; Solution.lean and
    Scott1976/DataTypesAsLattices/* must not.

alignment:
  namespace: "Scott1976.DataTypesAsLattices"
  statements:
    - source: "Theorem 2.6 (The definability theorem)"
      lean: "theorem_2_6"
      module: "Challenge (statement), Computability.lean (proof)"
      status: proved
      note: "Unary case: computable ↔ r.e. graph ↔ combinatory ↔ closed LAMBDA."
    - source: "Theorem 3.5 (The completeness theorem for definability)"
      lean: "theorem_3_5"
      module: "Challenge (statement), Enumeration.lean (proof)"
      status: proved
      note: "Myhill–Shepherdson: extensional LAMBDA p yields continuous q."
    - source: "Theorem 3.7 (The semigroup theorem)"
      lean: "theorem_3_7"
      module: "Challenge (statement), Enumeration.lean (proof)"
      status: proved
      note: "RE ∩ FUN is generated by R, L, and G-bar."
    - source: "Theorem 4.6 (The limit theorem)"
      lean: "theorem_4_6"
      module: "Challenge (statement), Retracts.lean (proof)"
      status: proved
      note: "Y(F) is a retract when F preserves retracts. Inverse-limit half is theorem_4_6_limit."
    - source: "Theorem 6.7 (The B_δ theorem)"
      lean: "theorem_6_7"
      module: "Challenge (statement), Classification.lean (proof)"
      status: proved
      note: "B_δ sets are exactly equalizers of continuous maps."
    - source: "Theorem 7.4 (The iterator theorem)"
      lean: "theorem_7_4"
      module: "Challenge (statement), Functionality.lean (proof)"
      status: proved
      note: "Z_n are characterized by functionality on all restricted equivalences."
