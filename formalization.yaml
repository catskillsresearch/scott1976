# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1976 Data Types as Lattices"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1976 paper *Data Types
    as Lattices* (Technical Monograph PRG-5; SIAM J. Comput. 5 (1976),
    522–587). The library target is a 1:1 onto translation of every numbered
    definition, theorem, example, and Tables 1–3.     Palomar Challenge/Solution
    select the 63 theorem declarations and 70 locked definitions named in
    comparator.json. A Comparator match establishes those selected
    statements, not every informal clause of every numbered theorem.
    The locked coproduct `plusR` uses the doubly strict
    conditional of (4.4) rather than the ordinary conditional written in
    displayed (4.10). Lean is
    written by AI agents under the direction and review of the author. Dana
    Scott did not review or endorse this formalization. There is no
    sorry outside the deliberate holes in Challenge.lean, no project-defined
    axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.LO, cs.LO]
  msc2020: ["06B35", "68Q55", "03B70"]

status:
  scope: >-
    The library is a 1:1 onto translation of the numbered items in Scott
    1976, except that plusR uses the doubly strict conditional of (4.4)
    in place of the ordinary conditional written in displayed (4.10).
    Comparator selects the 63 theorem declarations and 70 definitions
    named in comparator.json. That match establishes those selected
    statements; further library companions are not all compared.
