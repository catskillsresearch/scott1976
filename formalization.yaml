fidelity:
  divergences: >-
    Working source: sources/Data_Types_as_Lattices_vision.md
    (transcription of sources/Data_Types_as_Lattices.pdf). Compared
    claims are the spanning theorems named in comparator.json. Remaining
    source-level notes are listed in known_gaps and in arxiv.md.

sources:
  - title: "Data Types as Lattices"
    authors: ["Dana S. Scott"]
    type: "article"
    location: >-
      Technical Monograph PRG-5, Oxford University Computing Laboratory,
      Programming Research Group, September 1976; reprinted SIAM Journal on
      Computing, Volume 5, 1976, pages 522–587.
    relationship: formalizes
    author_endorsement: other
    note: >-
      Primary source. Dana Scott did not review or endorse this
      formalization. Working PDF: sources/Data_Types_as_Lattices.pdf.

related_formalizations:
  - id: "https://github.com/catskillsresearch/scott1972"
    relationship: other
    note: "Same-author formalization of Scott Continuous Lattices (1972); not imported here."

  - id: "https://github.com/catskillsresearch/scott1980"
    relationship: other
    note: "Same-author formalization of Scott PRG-19 (1980); not imported here."

  - id: "https://github.com/catskillsresearch/scott1982"
    relationship: other
    note: "Same-author formalization of Scott 1982 information systems; not imported here."

  - id: "https://github.com/catskillsresearch/scott_models"
    relationship: other
    note: >-
      Same-author sibling with cross-presentation equivalence theorems.
      This repository is an independent Palomar submission for the 1976 paper
      alone. See PROVENANCE.md.

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build repair,
        vision-OCR transcription, and arxiv.md drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: "Heaviest proof work."
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every definition
        and claim, and takes sole responsibility for the mathematical content.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    follows the scott1972 / cardb template.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review of
    the Lean source, and no review or endorsement by Dana Scott. Every proof
    step is checked by the Lean kernel.

known_gaps: []

limitations:
  - >-
    Comparator selects the 63 theorem declarations and 70 locked
    definitions named in comparator.json. A match establishes those
    selected statements, not every informal clause of every numbered
    theorem. Further companions remain in the library.
  - >-
    Challenge.lean may contain deliberate sorries; Solution.lean and
    Scott1976/DataTypesAsLattices/* must not.
  - >-
    The locked coproduct plusR implements Scott's displayed (4.10) with
    the doubly strict conditional dcondSet of (4.4), not the ordinary
    McCarthy conditional condSet written in that equation. On a mixed
    tag containing both zero and a successor, plusR returns topElem
    rather than the union of the two injections. This matches bool in
    (4.3), which (4.8)–(4.10) generalize, and is required for Theorem
    4.5 (a ⊕ b is a retract). Displayed (4.10) is therefore not a
    symbol-for-symbol 1:1 transcription.
  - >-
    Compared substitution is theorem_1_3 (unary composition),
    theorem_1_3_tuple (binary), and theorem_1_3_nary (ternary), not
    arbitrary finite-arity substitution.
  - >-
    theorem_1_5 proves continuity of extend f for every f, a
    strengthening of Scott's hypothesis that f is continuous;
    theorem_1_5_extends restores that hypothesis for agreement on the
    subspace.
  - >-
    theorem_2_2 is a conditional semantic congruence: it assumes the
    renamed bodies already have equal interpretations and lifts that
    equality through lambda. It is not source-level alpha conversion
    from a freshness hypothesis.
  - >-
    theorem_4_6_limit compares an inclusion-preserving bijection with
    the inverse limit (an order isomorphism), not a homeomorphism.
  - >-
    theorem_6_5 is the specialization of Scott's parameterized
    characterization to the representative target succSet topElem.

